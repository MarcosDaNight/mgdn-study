track: linux
title: { pt: Fundamentos de Linux, en: Linux fundamentals }
units:
  - id: linux-files
    title: { pt: Arquivos e permissões, en: Files and permissions }
    items:
      - id: linux-chmod-755
        type: choice
        q:
          pt: Qual é a permissão de um arquivo com modo `755`?
          en: What permissions does a file with mode `755` have?
        options:
          pt: ["dono: rwx, grupo: r-x, outros: r-x", "dono: rwx, grupo: rwx, outros: r-x", "dono: rw-, grupo: r--, outros: r--", "dono: r-x, grupo: r-x, outros: r-x"]
          en: ["owner: rwx, group: r-x, others: r-x", "owner: rwx, group: rwx, others: r-x", "owner: rw-, group: r--, others: r--", "owner: r-x, group: r-x, others: r-x"]
        correct: 0
        why:
          pt: "Cada dígito soma r=4, w=2, x=1. 7 = 4+2+1 (rwx) e 5 = 4+1 (r-x). Dono, grupo e outros, nessa ordem."
          en: "Each digit adds r=4, w=2, x=1. 7 = 4+2+1 (rwx) and 5 = 4+1 (r-x). Owner, group, others, in that order."
        src: https://man7.org/linux/man-pages/man1/chmod.1.html
      - id: linux-chmod-cmd
        type: command
        q:
          pt: Dê permissão de execução ao dono do arquivo `deploy.sh`, sem mexer nas outras.
          en: Give the owner of `deploy.sh` execute permission without touching the others.
        answer: [chmod, u+x, deploy.sh]
        extra: [chmod, "777", "+x", "u+x", "-R", chown]
        why:
          pt: "`u+x` altera só o bit de execução do usuário (`u`). `chmod 777` abriria tudo para todos, o que quase nunca é o certo."
          en: "`u+x` changes only the owner's (`u`) execute bit. `chmod 777` would open everything to everyone, which is almost never right."
        src: https://man7.org/linux/man-pages/man1/chmod.1.html
      - id: linux-find-large
        type: command
        q:
          pt: Liste os arquivos com mais de 100 MB sob `/var`.
          en: List files larger than 100 MB under `/var`.
        answer: [find, /var, -type, f, -size, +100M]
        extra: ["-name", "-mtime", "-100M", "-L"]
        why:
          pt: "`-size +100M` filtra por tamanho (o `+` significa 'maior que'). `-type f` ignora diretórios."
          en: "`-size +100M` filters by size (`+` means 'greater than'). `-type f` skips directories."
        src: https://man7.org/linux/man-pages/man1/find.1.html
      - id: linux-hardlink
        type: card
        q:
          pt: Qual a diferença entre um link simbólico e um hard link?
          en: What is the difference between a symbolic link and a hard link?
        a:
          pt: "O hard link é outro nome para o **mesmo inode**: apagar o original não afeta o link. O simbólico é um arquivo que guarda um **caminho**: se o alvo some, o link fica quebrado. Hard link não cruza sistemas de arquivos nem aponta para diretórios."
          en: "A hard link is another name for the **same inode**: deleting the original does not affect it. A symlink is a file holding a **path**: if the target goes away, the link breaks. Hard links cannot cross filesystems or point to directories."
        src: https://man7.org/linux/man-pages/man7/symlink.7.html
  - id: linux-processes
    title: { pt: Processos e systemd, en: Processes and systemd }
    items:
      - id: linux-sigterm
        type: choice
        q:
          pt: "Qual sinal `kill <pid>` envia por padrão, e por que ele é preferível ao `kill -9`?"
          en: "Which signal does `kill <pid>` send by default, and why is it preferable to `kill -9`?"
        options:
          pt: ["SIGTERM: o processo pode limpar recursos e encerrar", "SIGKILL: encerra na hora", "SIGHUP: recarrega a configuração", "SIGSTOP: pausa o processo"]
          en: ["SIGTERM: the process can clean up and exit", "SIGKILL: terminates immediately", "SIGHUP: reloads the configuration", "SIGSTOP: pauses the process"]
        correct: 0
        why:
          pt: "SIGTERM (15) pode ser tratado: o processo fecha arquivos e conexões. SIGKILL (9) não pode ser capturado e deixa lixo para trás. Tente TERM primeiro."
          en: "SIGTERM (15) can be handled: the process closes files and connections. SIGKILL (9) cannot be caught and leaves a mess. Try TERM first."
        src: https://man7.org/linux/man-pages/man7/signal.7.html
      - id: linux-systemctl-status
        type: command
        q:
          pt: Veja o estado do serviço `kubelet` pelo systemd.
          en: Check the state of the `kubelet` service in systemd.
        answer: [systemctl, status, kubelet]
        extra: [service, restart, enable, journalctl, "-u"]
        why:
          pt: "`systemctl status` mostra se está ativo, o PID e as últimas linhas de log. É o primeiro comando quando um nó está `NotReady`."
          en: "`systemctl status` shows whether it is active, the PID and the last log lines. It is the first command when a node is `NotReady`."
        src: https://man7.org/linux/man-pages/man1/systemctl.1.html
      - id: linux-journalctl
        type: command
        q:
          pt: Acompanhe ao vivo os logs do `kubelet`.
          en: Follow the `kubelet` logs live.
        answer: [journalctl, -u, kubelet, -f]
        extra: [tail, "-n", "-xe", systemctl]
        why:
          pt: "`-u` filtra por unit e `-f` segue novas linhas (como `tail -f`). Nos nós, o kubelet roda como serviço, então o log dele está no journal, não em `kubectl logs`."
          en: "`-u` filters by unit and `-f` follows new lines (like `tail -f`). On nodes the kubelet runs as a service, so its log is in the journal, not in `kubectl logs`."
        src: https://man7.org/linux/man-pages/man1/journalctl.1.html
  - id: linux-network
    title: { pt: Rede, en: Networking }
    items:
      - id: linux-ss
        type: command
        q:
          pt: Liste as portas TCP em escuta, com o processo dono de cada uma.
          en: List listening TCP ports with the owning process.
        answer: [ss, -tlnp]
        extra: [netstat, "-ua", "-s"]
        why:
          pt: "`-t` TCP, `-l` listening, `-n` sem resolver nomes, `-p` mostra o processo. O `ss` substituiu o `netstat`. Útil para confirmar que o `kube-apiserver` escuta na 6443."
          en: "`-t` TCP, `-l` listening, `-n` no name resolution, `-p` shows the process. `ss` replaced `netstat`. Handy to confirm `kube-apiserver` listens on 6443."
        src: https://man7.org/linux/man-pages/man8/ss.8.html
      - id: linux-ip-addr
        type: card
        q:
          pt: Que comando mostra os IPs das interfaces e qual o equivalente moderno de `ifconfig`?
          en: Which command shows interface IPs, and what is the modern replacement for `ifconfig`?
        a:
          pt: "`ip addr` (ou `ip a`). O pacote `iproute2` substituiu o `net-tools`: `ip route` no lugar de `route`, `ip neigh` no lugar de `arp`."
          en: "`ip addr` (or `ip a`). The `iproute2` package replaced `net-tools`: `ip route` instead of `route`, `ip neigh` instead of `arp`."
        src: https://man7.org/linux/man-pages/man8/ip.8.html
      - id: linux-dns-order
        type: card
        q:
          pt: Em que arquivo um Linux guarda os servidores DNS e quais domínios completam nomes curtos?
          en: Which file holds a Linux host's DNS servers and the search domains for short names?
        a:
          pt: "`/etc/resolv.conf` (`nameserver` e `search`). Dentro de um Pod, o kubelet monta um `resolv.conf` com `search <ns>.svc.cluster.local svc.cluster.local cluster.local`, por isso `meu-svc` resolve no mesmo namespace."
          en: "`/etc/resolv.conf` (`nameserver` and `search`). Inside a Pod the kubelet mounts a `resolv.conf` with `search <ns>.svc.cluster.local svc.cluster.local cluster.local`, which is why `my-svc` resolves in the same namespace."
        src: https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/
